services:
  btcguess:
    build: .
    container_name: btcguess
    restart: unless-stopped
    ports:
      - "3100:3000"
    volumes:
      - ./persistent:/app/persistent
    env_file:
      - .env
    environment:
      # Eventuali sovrascritture specifiche del container
      WEB_PORT: "3000"
    # Limita CPU se necessario (0.5 = mezzo core, 1.0 = un core intero)
    # Decommenta per limitare:
    # cpus: "0.5"
